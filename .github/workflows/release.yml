name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in .output/*.zip; do
            test -f "$artifact" || continue
            gh release create "$GITHUB_REF_NAME" "$artifact" --generate-notes
            exit 0
          done
          echo "No extension ZIP was produced" >&2
          exit 1
